<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OOP vs DOD Cache</title>
<style>
:root { --bg:#fff; --fg:#1b1f24; --muted:#64707d; --grid:#e3e7eb; --oop:#d1481f; --dod:#1f6fd1; }
@media (prefers-color-scheme: dark) { :root { --bg:#14181d; --fg:#e6e9ec; --muted:#8b97a3; --grid:#2a3139; --oop:#ff7a52; --dod:#5ea2ff; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
main { max-width:860px; margin:0 auto; padding:24px 16px 48px; }
h1 { font-size:1.4rem; margin:0 0 4px; }
p.sub { color:var(--muted); margin:0 0 20px; }
nav { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
nav a { padding:6px 12px; border:1px solid var(--grid); border-radius:6px; color:var(--fg); text-decoration:none; }
nav a[aria-current="page"] { background:var(--fg); color:var(--bg); border-color:var(--fg); }
svg { width:100%; height:auto; display:block; }
svg text { fill:var(--muted); font-size:12px; }
.legend { display:flex; gap:16px; margin:8px 0; }
.legend span::before { content:""; display:inline-block; width:12px; height:12px; border-radius:2px; margin-right:6px; vertical-align:-1px; background:var(--c); }
table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
th, td { text-align:right; padding:6px 10px; border-bottom:1px solid var(--grid); }
th:first-child, td:first-child { text-align:left; }
.scroll { overflow-x:auto; }
.cols { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:16px; }
.cols h2 { font-size:1rem; margin:0 0 6px; }
pre { margin:0; padding:10px 12px; border:1px solid var(--grid); border-radius:6px; overflow-x:auto; font:13px/1.5 ui-monospace, Menlo, monospace; }
pre .hot { display:block; background:color-mix(in srgb, var(--fg) 10%, transparent); }
.take { margin:0 0 16px; padding:10px 12px; border-left:3px solid var(--dod); background:color-mix(in srgb, var(--fg) 5%, transparent); }
.notes { padding-left:20px; }
.notes li { margin-bottom:6px; }
code { font:.9em ui-monospace, Menlo, monospace; }
nav.sizes a { padding:2px 10px; font-size:.9rem; }
</style>
</head>
<body>
<main>
<h1>OOP vs DOD: cache behaviour</h1>
<p class="sub">Cold bytes per entity on the x axis. Same update loop, different memory layout.</p>
<nav id="nav"></nav>
<section id="view">Loading results…</section>
</main>
<script>
const COLORS = { oop: "var(--oop)", dod: "var(--dod)" };
const fmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(0) + "K" : String(n);
const median = (xs) => {
  const s = [...xs].sort((a, b) => a - b), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};

// Results are served from ../results relative to this page (server root = repo root).
async function jsonl(name) {
  const res = await fetch("../results/" + name);
  if (!res.ok) throw new Error(name + ": HTTP " + res.status);
  return (await res.text()).split("\n").filter(Boolean).map((l) => JSON.parse(l));
}

let DATA;
async function load() {
  const [timing, cache, asm] = await Promise.all([jsonl("timing.jsonl"), jsonl("cachegrind.jsonl"), jsonl("asm.jsonl")]);
  const groups = {};
  for (const r of timing) (groups[r.variant + "|" + r.cold] ??= []).push(r.ms);
  const wall = Object.entries(groups).map(([k, ms]) => {
    const [variant, cold] = k.split("|");
    return { variant, cold: +cold, median: median(ms), min: Math.min(...ms), max: Math.max(...ms) };
  });
  DATA = { wall, cache, asm };
}

const PAGES = {
  wall: { title: "Wall clock", unit: "ms (median of runs, bars show min-max)", series: () => bySeries(DATA.wall, "median", "min", "max") },
  d1:   { title: "L1 data misses", unit: "simulated D1 misses", series: () => bySeries(DATA.cache, "d1_misses") },
  ll:   { title: "Last-level misses", unit: "simulated last-level (LL) misses", series: () => bySeries(DATA.cache, "ll_misses") },
  table:{ title: "Data" },
  asm:  { title: "Assembly" },
};

function bySeries(rows, key, lo, hi) {
  const out = {};
  for (const r of rows) (out[r.variant] ??= []).push({ x: r.cold, y: r[key], lo: lo ? r[lo] : r[key], hi: hi ? r[hi] : r[key] });
  for (const v in out) out[v].sort((a, b) => a.x - b.x);
  return out;
}

function chart(series, unit) {
  const W = 760, H = 360, m = { l: 64, r: 16, t: 16, b: 48 };
  const xs = [...new Set(Object.values(series).flat().map((p) => p.x))].sort((a, b) => a - b);
  const ymax = Math.max(...Object.values(series).flat().map((p) => p.hi)) * 1.08;
  const X = (x) => m.l + (xs.indexOf(x) / Math.max(xs.length - 1, 1)) * (W - m.l - m.r);
  const Y = (y) => H - m.b - (y / ymax) * (H - m.t - m.b);
  let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + unit + '">';
  for (let i = 0; i <= 4; i++) {
    const v = (ymax / 4) * i, y = Y(v);
    s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y + '" y2="' + y + '" stroke="var(--grid)"/>';
    s += '<text x="' + (m.l - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + fmt(Math.round(v)) + "</text>";
  }
  for (const x of xs) s += '<text x="' + X(x) + '" y="' + (H - m.b + 18) + '" text-anchor="middle">' + x + "</text>";
  s += '<text x="' + (W / 2) + '" y="' + (H - 6) + '" text-anchor="middle">cold bytes per entity</text>';
  for (const [v, pts] of Object.entries(series)) {
    const c = COLORS[v] || "var(--fg)";
    s += '<polyline fill="none" stroke="' + c + '" stroke-width="2.5" points="' + pts.map((p) => X(p.x) + "," + Y(p.y)).join(" ") + '"/>';
    for (const p of pts) {
      if (p.hi !== p.lo) s += '<line x1="' + X(p.x) + '" x2="' + X(p.x) + '" y1="' + Y(p.lo) + '" y2="' + Y(p.hi) + '" stroke="' + c + '" stroke-width="1.5"/>';
      s += '<circle cx="' + X(p.x) + '" cy="' + Y(p.y) + '" r="4" fill="' + c + '"><title>' + v + " cold=" + p.x + ": " + Math.round(p.y).toLocaleString() + "</title></circle>";
    }
  }
  return s + "</svg>";
}

function table() {
  const cold = [...new Set(DATA.cache.map((r) => r.cold))].sort((a, b) => a - b);
  const get = (rows, v, c) => rows.find((r) => r.variant === v && r.cold === c) || {};
  let h = '<div class="scroll"><table><thead><tr><th>cold</th><th>oop ms</th><th>dod ms</th><th>oop D1</th><th>dod D1</th><th>oop LL</th><th>dod LL</th></tr></thead><tbody>';
  for (const c of cold) {
    const o = get(DATA.cache, "oop", c), d = get(DATA.cache, "dod", c);
    const wo = get(DATA.wall, "oop", c), wd = get(DATA.wall, "dod", c);
    h += "<tr><td>" + c + "</td><td>" + wo.median + "</td><td>" + wd.median + "</td><td>" + fmt(o.d1_misses) + "</td><td>" + fmt(d.d1_misses) + "</td><td>" + fmt(o.ll_misses) + "</td><td>" + fmt(d.ll_misses) + "</td></tr>";
  }
  return h + "</tbody></table></div>";
}

const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

// Timed region of each variant; the first backward branch closes the inner loop (highlighted).
function asmView(cold) {
  const sizes = [...new Set(DATA.asm.map((r) => r.cold))].sort((a, b) => a - b);
  let h = '<p class="take"><strong>Takeaway:</strong> the compiler is not the cause. Both layouts compile to nearly the same loop; the speed and cache-miss gap comes from the addresses the loop touches.</p>';
  h += '<nav class="sizes">cold: ' + sizes.map((c) => '<a href="#asm/' + c + '"' + (c === cold ? ' aria-current="page"' : "") + ">" + c + "</a>").join("") + "</nav>";
  h += '<div class="cols">';
  const counts = {};
  for (const v of ["oop", "dod"]) {
    const row = DATA.asm.find((r) => r.variant === v && r.cold === cold);
    if (!row) continue;
    const end = row.lines.findIndex((l) => /^b\.\w+ \.\w+/.test(l));
    const start = row.lines.indexOf(row.lines[end].split(" ")[1] + ":");
    counts[v] = end - start;
    h += "<div><h2>" + v + "</h2><pre>" + row.lines.map((l, i) => (i > start && i <= end ? '<span class="hot">' + esc(l) + "</span>" : esc(l) + "\n")).join("") + "</pre></div>";
  }
  h += "</div><p class=\"sub\">Highlighted: the inner loop, one iteration per element (" +
    Object.entries(counts).map(([v, n]) => v + " " + n + " instructions").join(", ") +
    "). The code between the two clock_gettime calls. Details in docs/assembly-analysis.md.</p>";
  h += '<ul class="notes">' +
    "<li><strong>Same work per element:</strong> one load, add 1, one store. DOD even runs one more instruction (separate <code>add</code> and <code>cmp</code>), yet is much faster.</li>" +
    "<li><strong>Only the stride differs:</strong> OOP advances by the entity size (<code>cold</code> + 4 = " + (cold + 4) + " B, the immediate in <code>str w, [x], #N</code>); DOD always advances 4 B.</li>" +
    "<li><strong>Why it matters:</strong> with a 64 B cache line, OOP at a stride of 64 B or more uses one line per element and wastes the rest; DOD uses all 16 <code>health</code> values in each line.</li>" +
    "<li><strong>At cold = 0</strong> the entity is just <code>health</code>, so both loops are identical.</li>" +
    "<li><strong>Neither loop is vectorized</strong> (scalar <code>w</code> registers), so SIMD is not what separates them.</li>" +
    "</ul>";
  return h;
}

function render() {
  const [hash, param] = (location.hash || "#wall").slice(1).split("/");
  const id = PAGES[hash] ? hash : "wall";
  const page = PAGES[id];
  document.getElementById("nav").innerHTML = Object.entries(PAGES)
    .map(([k, p]) => '<a href="#' + k + '"' + (k === id ? ' aria-current="page"' : "") + ">" + p.title + "</a>").join("");
  document.getElementById("view").innerHTML = id === "asm"
    ? asmView(param === undefined ? 60 : +param)
    : page.series
      ? '<div class="legend"><span style="--c:var(--oop)">oop</span><span style="--c:var(--dod)">dod</span></div>' + chart(page.series(), page.unit) + '<p class="sub">' + page.unit + "</p>"
      : table();
}

load().then(() => {
  window.addEventListener("hashchange", render);
  render();
}).catch((e) => {
  document.getElementById("view").textContent = "Could not load results: " + e.message + ". Serve the repo root (scripts/start.sh) so ../results/ is reachable.";
});
</script>
</body>
</html>
